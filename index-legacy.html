<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChurchTools Extension</title>
</head>

<body>
    <div id="init-loader" style="padding: 20px; text-align: center; font-family: sans-serif;">
        <h2>Extension Loading...</h2>
        <p>Verification Build: v1.0.6-iife-inline (Bundled & Inlined, No External Requests)</p>
        <div id="init-log"
            style="font-family: monospace; text-align: left; margin-top: 10px; font-size: 12px; color: #666;"></div>
    </div>
    <div id="app"></div>

    <!-- Standard Script for Logging (Runs immediately) -->
    <script>
        window.log = function (msg) {
            console.log('[Legacy] ' + msg);
            try {
                const el = document.getElementById('init-log');
                if (el) el.innerHTML += msg + '<br>';
            } catch (e) { }
        };
        window.log('Logger initialized (Standard Script)');
    </script>

    <!-- Main Entry Point (Vite will bundle this) -->
    <script type="module" src="./src/main-legacy.ts"></script>
</body>

</html>
