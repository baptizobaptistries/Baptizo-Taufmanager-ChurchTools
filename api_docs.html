        function setColorScheme(theme) {
            var meta = document.createElement('meta');
            meta.name = "color-scheme";
            meta.content = theme;
            document.getElementsByTagName('head')[0].appendChild(meta);
            if (theme === 'dark') {
                document.querySelector('body')?.classList.add('dark');
                document.querySelector('body')?.classList.remove('light');
            } else {
                document.querySelector('body')?.classList.add('light');
                document.querySelector('body')?.classList.remove('dark');
            }
        }
        //determines if the user has a set theme
        function detectColorScheme() {
            var theme = 'light'; //default to light
            if (window.localStorage && window.matchMedia && typeof Storage !== 'undefined' && typeof localStorage === 'object' && typeof localStorage.getItem === 'function') {
                const storageTheme = localStorage.getItem('theme');
                if (storageTheme) {
                    var printview = false;                    if (!printview && !window.matchMedia('print').matches && (storageTheme === 'dark' || (storageTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches))) {
                        theme = 'dark';
                    }
                } else {
                    localStorage.setItem('theme', 'light');
                }
            }
            if (window.location.search.includes('darkmode=true')) {
                theme = 'dark';
            }
            setColorScheme(theme);
        }
        detectColorScheme();
    </script>
